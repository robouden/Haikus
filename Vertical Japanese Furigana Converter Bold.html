<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Japanese Furigana Converter</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f5f5f7;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      h1 {
        margin-top: 0;
        font-size: 1.2rem;
        color: #333;
      }
      .container {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }
      .panel {
        flex: 1;
        background: #ffffff;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
      }
      textarea {
        width: 100%;
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        font-size: 1rem;
        font-family: monospace;
        resize: none;
        outline: none;
      }
      textarea:focus {
        border-color: #0066cc;
      }

      /* Vertical Preview Area */
      .vertical-preview {
        flex: 1;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 30px;
        overflow-x: auto;
        background-color: #ffffff;

        /* Standard Vertical Japanese Styling */
        writing-mode: vertical-rl;
        -webkit-writing-mode: vertical-rl;
        text-orientation: mixed;
        font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: 26pt;
        line-height: 1.7;
        letter-spacing: 0.1 em;

        /* Make main poem text & Kanji bold */
        font-weight: 700;
      }

      /* Native Ruby Rules to ensure Furigana is on the RIGHT side and aligned TOP */
      .vertical-preview ruby {
        ruby-position: over; /* Places furigana on the RIGHT side in vertical-rl */
        ruby-align: start; /* Top-aligns furigana with the character */
      }

      .vertical-preview rt {
        font-size: 0.35em;
        line-height: 1;
        letter-spacing: 0em;
        text-align: start;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Haiku / Renku Vertical Converter</h1>

    <div class="container">
      <!-- Input Panel -->
      <div class="panel">
        <h3>Type Markdown Syntax:</h3>
        <textarea id="inputText" placeholder="Type using 漢字《ふりがな》...">宵《よい》の金星《きんせい》
山の魂《たましい》へ
笑《え》み寄《よ》り添《そ》う</textarea>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <h3>Vertical Output:</h3>
        <div id="outputText" class="vertical-preview"><ruby>宵<rt>よい</rt></ruby><ruby>の<rt>きん</rt></ruby><ruby>金<rt>せい</rt></ruby><ruby>星<rt></rt></ruby><br><ruby>山<rt>たま</rt></ruby><ruby>の<rt>しい</rt></ruby><ruby>魂<rt></rt></ruby>へ<br><ruby>笑<rt>え</rt></ruby><ruby>み<rt>よ</rt></ruby><ruby>寄<rt></rt></ruby><ruby>り<rt>そ</rt></ruby><ruby>添<rt></rt></ruby>う</div>
      </div>
    </div>

    <script>
      /**
       * Splits readings across individual Kanji to force exact top alignment
       */
      function parseFurigana(text) {
        if (!text) return "";

        // Match patterns like 宵《よい》 or 金星《きんせい》
        const pattern = /([^\s《》{}]+)《([^》]+)》|\{([^|}]+)\|([^}]+)\}/g;

        return text
          .replace(pattern, (match, k1, f1, k2, f2) => {
            const kanjiStr = k1 || k2;
            const furiStr = f1 || f2;

            // Case A: User explicitly split using pipes (e.g., 金星《きん|せい》)
            if (furiStr.includes("|")) {
              const furiParts = furiStr.split("|");
              const kanjiParts = Array.from(kanjiStr);
              return kanjiParts
                .map(
                  (k, i) => `<ruby>${k}<rt>${furiParts[i] || ""}</rt></ruby>`,
                )
                .join("");
            }

            const kanjiChars = Array.from(kanjiStr);

            // Case B: Single Kanji character -> 1-to-1 match
            if (kanjiChars.length === 1) {
              return `<ruby>${kanjiStr}<rt>${furiStr}</rt></ruby>`;
            }

            // Case C: Multi-Kanji word -> auto-estimate split (e.g. 金星 -> きん / せい)
            // Evenly splits readings across characters so each Kanji gets its exact reading top-aligned
            const totalFuriLen = furiStr.length;
            const chunkLen = Math.ceil(totalFuriLen / kanjiChars.length);

            let resultHtml = "";
            for (let i = 0; i < kanjiChars.length; i++) {
              const charFuri = furiStr.substr(i * chunkLen, chunkLen);
              resultHtml += `<ruby>${kanjiChars[i]}<rt>${charFuri}</rt></ruby>`;
            }

            return resultHtml;
          })
          .replace(/\n/g, "<br>");
      }

      const input = document.getElementById("inputText");
      const output = document.getElementById("outputText");

      function updatePreview() {
        output.innerHTML = parseFurigana(input.value);
      }

      input.addEventListener("input", updatePreview);

      // Initial render
      updatePreview();
    </script>
  

</body></html>
