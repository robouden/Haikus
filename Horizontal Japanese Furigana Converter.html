<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Japanese Furigana Converter</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f5f5f7;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      h1 {
        margin-top: 0;
        font-size: 1.2rem;
        color: #333;
      }
      .container {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }
      .panel {
        flex: 1;
        background: #ffffff;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
      }
      textarea {
        width: 100%;
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        font-size: 1rem;
        font-family: monospace;
        resize: none;
        outline: none;
      }
      textarea:focus {
        border-color: #0066cc;
      }

      /* Horizontal Preview Area */
      .horizontal-preview {
        flex: 1;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 30px;
        overflow-y: auto;
        background-color: #ffffff;

        writing-mode: horizontal-tb;
        font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: 26pt;
        line-height: 2.2;
        letter-spacing: 0.05em;

        font-weight: 400;
      }

      .horizontal-preview ruby {
        ruby-position: over;
        ruby-align: start;
      }

      .horizontal-preview rt {
        font-size: 0.45em;
        line-height: 1;
        letter-spacing: 0em;
        text-align: start;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Haiku / Renku Horizontal Converter</h1>

    <div class="container">
      <!-- Input Panel -->
      <div class="panel">
        <h3>Type Markdown Syntax:</h3>
        <textarea id="inputText" placeholder="Type using 漢字《ふりがな》...">宵《よい》の金星《きんせい》
山の魂《たましい》へ
笑《え》み寄《よ》り添《そ》う</textarea>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <h3>Horizontal Output:</h3>
        <div id="outputText" class="horizontal-preview"></div>
      </div>
    </div>

    <script>
      /**
       * Splits readings across individual Kanji to force exact top alignment
       */
      function parseFurigana(text) {
        if (!text) return "";

        // Match patterns like 宵《よい》 or 金星《きんせい》
        const pattern = /([^\s《》{}]+)《([^》]+)》|\{([^|}]+)\|([^}]+)\}/g;

        return text
          .replace(pattern, (match, k1, f1, k2, f2) => {
            const kanjiStr = k1 || k2;
            const furiStr = f1 || f2;

            // Case A: User explicitly split using pipes (e.g., 金星《きん|せい》)
            if (furiStr.includes("|")) {
              const furiParts = furiStr.split("|");
              const kanjiParts = Array.from(kanjiStr);
              return kanjiParts
                .map(
                  (k, i) => `<ruby>${k}<rt>${furiParts[i] || ""}</rt></ruby>`,
                )
                .join("");
            }

            const kanjiChars = Array.from(kanjiStr);

            // Case B: Single Kanji character -> 1-to-1 match
            if (kanjiChars.length === 1) {
              return `<ruby>${kanjiStr}<rt>${furiStr}</rt></ruby>`;
            }

            // Case C: Multi-Kanji word -> auto-estimate split (e.g. 金星 -> きん / せい)
            const totalFuriLen = furiStr.length;
            const chunkLen = Math.ceil(totalFuriLen / kanjiChars.length);

            let resultHtml = "";
            for (let i = 0; i < kanjiChars.length; i++) {
              const charFuri = furiStr.substr(i * chunkLen, chunkLen);
              resultHtml += `<ruby>${kanjiChars[i]}<rt>${charFuri}</rt></ruby>`;
            }

            return resultHtml;
          })
          .replace(/\n/g, "<br>");
      }

      const input = document.getElementById("inputText");
      const output = document.getElementById("outputText");

      function updatePreview() {
        output.innerHTML = parseFurigana(input.value);
      }

      input.addEventListener("input", updatePreview);

      // Initial render
      updatePreview();
    </script>

</body></html>
